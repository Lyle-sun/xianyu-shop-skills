<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>main image</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;overflow:hidden}
  body{position:relative;font-family:"PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--fg)}
  .abs{position:absolute}
  .serif{font-family:"Songti SC","STSong",serif}
  .kai{font-family:"Kaiti SC","STKaiti",serif}
  .heavy{font-weight:900}
  .center{left:0;right:0;text-align:center}
  .nowrap{white-space:nowrap}
</style>
<!--SPEC-->
</head>
<body>
<div id="root"></div>
<script>
/* Themes: bg, fg (body text), accent (big words), accent2 (lines/borders), band (ribbon bg), bandFg, chip, chipFg, font (display face) */
const THEMES = {
  "ink-gold":   {bg:"radial-gradient(circle at 50% 42%,#1c2740 0%,#121a2b 70%)", fg:"#f4ead6", accent:"#e3c27a", accent2:"#b8924a", band:"#b3261e", bandFg:"#fff6e6", chip:"#f4ead6", chipFg:"#121a2b", font:"kai"},
  "red-gold":   {bg:"linear-gradient(160deg,#c8231c 0%,#9e130f 100%)", fg:"#fff4d6", accent:"#ffe08a", accent2:"#ffd25e", band:"#ffd25e", bandFg:"#8a0e0a", chip:"#fff4d6", chipFg:"#9e130f", font:"heavy"},
  "blue-white": {bg:"linear-gradient(180deg,#e9f1ff 0%,#ffffff 60%)", fg:"#1f2d4d", accent:"#1d4ed8", accent2:"#1d4ed8", band:"#1d4ed8", bandFg:"#ffffff", chip:"#ffffff", chipFg:"#1d4ed8", font:"heavy"},
  "kids-yellow":{bg:"linear-gradient(180deg,#fff3c4 0%,#ffe08a 100%)", fg:"#5a3b00", accent:"#ff6a00", accent2:"#ff9f1a", band:"#ff6a00", bandFg:"#ffffff", chip:"#ffffff", chipFg:"#d95600", font:"heavy"},
  "fresh-green":{bg:"linear-gradient(180deg,#e7f7e4 0%,#c9ecc2 100%)", fg:"#1e4620", accent:"#178a3a", accent2:"#2fa84f", band:"#178a3a", bandFg:"#ffffff", chip:"#ffffff", chipFg:"#178a3a", font:"heavy"},
  "tech-white": {bg:"#ffffff", fg:"#111111", accent:"#111111", accent2:"#6d4aff", band:"#6d4aff", bandFg:"#ffffff", chip:"#f3f0ff", chipFg:"#3b2a9e", font:"heavy"},
  "tech-dark":  {bg:"linear-gradient(160deg,#16161d 0%,#0b0b10 100%)", fg:"#eaeaf2", accent:"#ffffff", accent2:"#ff4d6d", band:"#ff4d6d", bandFg:"#ffffff", chip:"#22222c", chipFg:"#eaeaf2", font:"heavy"}
};
const S = window.SPEC || {};
const T = Object.assign({}, THEMES[S.theme||"ink-gold"], S.colors||{});
const r = document.documentElement.style;
for (const k of ["bg","fg"]) r.setProperty("--"+k, T[k]);
const H = S._h || 1080;
document.documentElement.style.height = document.body.style.height = H + "px";
const root = document.getElementById("root");
const el = (tag, css, html, cls) => { const e=document.createElement(tag); e.className="abs "+(cls||""); e.style.cssText=css; if(html!=null) e.innerHTML=html; root.appendChild(e); return e; };
const esc = s => String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const face = f => f==="kai" ? "kai heavy" : f==="serif" ? "serif heavy" : "heavy";

/* Fit a single-line element's font size down until it fits maxWidth */
function fit(e, maxW, start, min){ if(!e.firstElementChild || e.firstElementChild.dataset.m!=='1'){ const sp=document.createElement('span'); sp.dataset.m='1'; sp.style.display='inline-block'; while(e.firstChild) sp.appendChild(e.firstChild); e.appendChild(sp);} const m=e.firstElementChild; let fs=start; e.style.fontSize=fs+"px"; while(m.offsetWidth>maxW && fs>min){fs-=4; e.style.fontSize=fs+"px";} return fs; }

function frame(){ el("div",`inset:28px;border:3px solid ${T.accent2};opacity:.9`); el("div",`inset:40px;border:1px solid ${T.accent2};opacity:.45`); }

function topLine(y){ if(!S.kicker) return; const e=el("div",`top:${y}px;font-size:42px;letter-spacing:10px;color:${T.accent}`, `<span style="border-top:2px solid ${T.accent2};border-bottom:2px solid ${T.accent2};padding:8px 26px">${esc(S.kicker)}</span>`,"center nowrap"); }

function bigWords(y, h){
  const words = S.big || [];
  const lines = Array.isArray(words[0]) ? words : [words];
  const lh = h / lines.length;
  lines.forEach((ln,i)=>{
    const html = ln.map(esc).join(`<i style="font-style:normal;color:${T.accent2};font-size:.6em;vertical-align:middle;margin:0 4px">·</i>`);
    const e = el("div",`top:${y+i*lh}px;line-height:1;color:${T.accent};text-shadow:0 6px 0 rgba(0,0,0,.25);letter-spacing:4px`, html, "center nowrap "+face(T.font));
    fit(e, 960, Math.min(200, lh*0.92), 70);
  });
}

function ribbon(y){ if(!S.ribbon) return; const e=el("div",`top:${y}px;left:50%;transform:translateX(-50%);background:${T.band};color:${T.bandFg};font-size:50px;font-weight:800;letter-spacing:5px;padding:14px 54px;border-radius:8px;box-shadow:0 6px 0 rgba(0,0,0,.22)`, esc(S.ribbon), "nowrap"); fit(e, 940, 50, 30); }

function chips(y, maxH){
  const items = S.chips || []; if(!items.length) return 0;
  const cols = items.length<=3 ? items.length : (items.length<=4 ? 4 : (items.length<=6 ? 3 : 4));
  const rows = Math.ceil(items.length/cols); const gap=22; const rowH=Math.min(112,(maxH-(rows-1)*gap)/rows);
  const g = el("div",`top:${y}px;left:96px;right:96px;display:grid;grid-template-columns:repeat(${cols},1fr);gap:${gap}px`);
  items.forEach((t,i)=>{ const last = i===items.length-1 && items.length%cols!==0; const span = last ? cols-(items.length%cols)+1 : 1;
    const c=document.createElement("div"); c.className="nowrap"; c.style.cssText=`grid-column:span ${span};height:${rowH}px;display:flex;align-items:center;justify-content:center;background:${last&&span>1?T.accent:T.chip};color:${T.chipFg};font-size:${Math.min(46,rowH*0.42)}px;font-weight:800;border-radius:10px;border:3px solid ${T.accent2}`; c.textContent=t; g.appendChild(c); });
  return rows*rowH+(rows-1)*gap;
}

function note(y){ if(!S.note) return; el("div",`top:${y}px;font-size:38px;letter-spacing:5px;color:${T.accent}`, esc(S.note), "center nowrap"); }
function bottom(){ if(!S.bottom) return; el("div",`bottom:60px;left:60px;right:60px;height:104px;background:${T.accent};color:${T.bandFg==="#ffffff"?"#ffffff":T.chipFg};display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;letter-spacing:4px`, esc(S.bottom), "nowrap"); }
function seal(){ if(!S.seal) return; const s=[...S.seal].slice(0,4); el("div",`top:58px;right:58px;width:92px;height:92px;border:5px solid ${T.band};color:${T.band};font-size:46px;display:grid;grid-template-columns:1fr 1fr;line-height:41px;text-align:center;padding:2px;transform:rotate(-6deg)`, s.map(c=>`<span>${esc(c)}</span>`).join(""), "kai heavy"); }
function badge(){ if(!S.badge) return; el("div",`top:64px;left:64px;background:${T.band};color:${T.bandFg};font-size:34px;font-weight:800;padding:8px 22px;border-radius:999px`, esc(S.badge), "nowrap"); }
function deco(){ if(S.deco!=="bagua") return; el("div",`left:50%;top:400px;transform:translate(-50%,-50%);opacity:.13`, `<svg width="760" height="760" viewBox="-100 -100 200 200"><g fill="none" stroke="${T.accent}" stroke-width="1.6"><circle r="96"/><circle r="70"/><circle r="30"/></g><g fill="${T.accent}"><path d="M0,-30 A30,30 0 0,1 0,30 A15,15 0 0,1 0,0 A15,15 0 0,0 0,-30Z"/></g><g fill="${T.accent}">${[0,45,90,135,180,225,270,315].map(a=>`<g transform="rotate(${a})"><rect x="-14" y="-92" width="28" height="4"/><rect x="-14" y="-84" width="12" height="4"/><rect x="2" y="-84" width="12" height="4"/><rect x="-14" y="-76" width="28" height="4"/></g>`).join("")}</g></svg>`); }

/* ---------- layouts ---------- */
const L = {
  /* 大字报：主题词超大 + 卖点条 + 门类格子 + 交付横幅 */
  poster(){ if(S.frame!==false) frame(); deco(); seal(); badge(); topLine(92);
    bigWords(212, Array.isArray((S.big||[])[0]) ? 280 : 160);
    const twoLine = Array.isArray((S.big||[])[0]);
    ribbon(twoLine?512:412);
    const cy = twoLine?622:546; const h = chips(cy, twoLine?190:276);
    note(cy+h+26); bottom(); },

  /* 目录清单：标题 + 编号目录（带数量）+ 底部徽章 */
  catalog(){ if(S.frame!==false) frame(); seal(); badge(); topLine(84);
    const t=el("div",`top:150px;line-height:1.05;color:${T.accent};letter-spacing:3px`, esc(S.title||""), "center nowrap "+face(T.font)); fit(t,960,124,60);
    ribbon(300);
    const items=(S.list||[]).slice(0,10); const top=410, avail=470; const rowH=Math.min(64, avail/items.length);
    const box=el("div",`top:${top}px;left:110px;right:110px;background:${T.chip};border:3px solid ${T.accent2};border-radius:14px;padding:18px 34px`);
    items.forEach((it,i)=>{ const [name,count]=Array.isArray(it)?it:[it,""]; const row=document.createElement("div"); row.style.cssText=`display:flex;align-items:center;height:${rowH}px;font-size:${Math.min(36,rowH*0.6)}px;color:${T.chipFg};border-bottom:${i<items.length-1?`1px dashed ${T.accent2}`:"none"}`; row.innerHTML=`<b style="width:72px;color:${T.band}">${String(i+1).padStart(2,"0")}</b><span style="flex:1;font-weight:700" class="nowrap">${esc(name)}</span><span style="font-weight:800;color:${T.band}">${esc(count)}</span>`; box.appendChild(row); });
    bottom(); },

  /* 封面型（工具/Skill/手册）：标签 + 超大黑体标题 + 版本标 + 01/02/03 步骤 + 一句好处 */
  cover(){ const pad=86;
    if(S.kicker) el("div",`top:${pad}px;left:${pad}px;background:${T.band};color:${T.bandFg};font-size:34px;font-weight:800;padding:10px 24px;border-radius:8px`, esc(S.kicker), "nowrap");
    const lines=S.titleLines||[S.title||""]; let y=pad+100;
    lines.forEach((ln,i)=>{ const hl=(S.highlight||[]).includes(i); const e=el("div",`top:${y}px;left:${pad}px;line-height:1.08;color:${hl?T.accent2:T.accent};letter-spacing:2px`, esc(ln), "nowrap heavy"); fit(e,1080-pad*2,110,60); y+=e.offsetHeight+6; });
    if(S.tag) { el("div",`top:${y+18}px;left:${pad}px;font-size:40px;font-weight:800;color:${T.accent2};border:3px solid ${T.accent2};padding:6px 22px;border-radius:999px`, esc(S.tag), "nowrap"); y+=96; }
    const steps=(S.steps||[]).slice(0,4); let sy=Math.max(y+36, H===1080?560:y+60); const stopY=S.bottom?H-180:H-90; const gapY=steps.length?Math.min(H===1080?84:150,(stopY-sy)/steps.length):0;
    steps.forEach((st,i)=>{ el("div",`top:${sy}px;left:${pad}px;right:${pad}px;display:flex;align-items:center;gap:22px;font-size:40px;color:${T.fg};border-bottom:2px solid ${T.accent2}33;padding-bottom:12px`, `<b style="color:${T.accent2};font-size:46px">${String(i+1).padStart(2,"0")}</b><span style="font-weight:700">${esc(st)}</span>`, "nowrap"); sy+=gapY; });
    if(S.bottom) el("div",`bottom:${pad-10}px;left:${pad}px;right:${pad}px;background:${T.chip};color:${T.chipFg};font-size:38px;font-weight:800;padding:20px 28px;border-radius:14px`, esc(S.bottom), "nowrap");
    if(S.icon) el("div",`top:${pad+40}px;right:${pad}px;font-size:150px;line-height:1`, esc(S.icon)); },


  /* 内页压字（资料类默认）：自己资料的一页真实内页铺满 + 1–3 条粗字条 + 可选页数标 + 底部交付条 */
  overlay(){ const src=(S.images||[])[0]||"";
    el("div",`inset:0;background:#fff url('${src}') center ${S.align||"top"}/cover no-repeat`);
    if(S.veil) el("div",`inset:0;background:rgba(255,255,255,${S.veil})`);
    const C=S.bandColors||[["#ffe14d","#111111"],["#ff4a2d","#ffffff"],["#ffe14d","#c81d0e"]];
    const bands=(S.bands||[]).slice(0,3); let y=Math.round(H*(S.bandsTop||0.36));
    bands.forEach((t,i)=>{ const [bg,fg]=C[i%C.length]; const e=el("div",`top:${y}px;left:50%;transform:translateX(-50%) rotate(${S.tilt||0}deg);background:${bg};color:${fg};padding:10px 34px;border-radius:10px;box-shadow:0 8px 0 rgba(0,0,0,.18);letter-spacing:2px;line-height:1.15`, esc(t), "nowrap heavy"); fit(e, 980, i===0?120:96, 48); y+=e.offsetHeight+24; });
    if(S.tag) el("div",`top:${y+6}px;right:70px;background:#ff2d2d;color:#fff;font-size:56px;padding:6px 26px;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.18)`, esc(S.tag), "nowrap heavy");
    if(S.bottom) el("div",`left:0;right:0;bottom:0;height:120px;background:${S.bottomBg||"#1d4ed8"};color:#fff;display:flex;align-items:center;justify-content:center;font-size:46px;letter-spacing:4px`, esc(S.bottom), "nowrap heavy");
    if(S.badge) badge(); },
  /* 预览拼图（模板/素材/练习纸）：用户的真实截图拼成网格 + 大数量 + 标题条 */
  preview(){ const imgs=(S.images||[]).slice(0,9); const n=imgs.length; const cols=n<=4?2:3; const rows=Math.ceil(n/cols);
    const g=el("div",`inset:0;display:grid;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);gap:6px;background:${T.accent2}`);
    imgs.forEach(src=>{ const d=document.createElement("div"); d.style.cssText=`background:#fff url('${src}') center/cover no-repeat`; g.appendChild(d); });
    const bar=el("div",`left:0;right:0;bottom:0;height:250px;background:${T.band};display:flex;align-items:center;padding:0 54px;gap:34px`);
    bar.innerHTML=`<div class="heavy nowrap" style="font-size:140px;line-height:1;color:${T.band};background:${T.bandFg};padding:10px 26px;border-radius:18px">${esc(S.count||"")}</div><div style="color:${T.bandFg}"><div class="heavy nowrap" style="font-size:64px;line-height:1.15">${esc(S.title||"")}</div><div class="nowrap" style="font-size:38px;font-weight:700;opacity:.92">${esc(S.subtitle||"")}</div></div>`;
    if(S.badge) badge(); }
};
(L[S.layout||"poster"]||L.poster)();
</script>
</body>
</html>
